<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골목버림 - 골목단지</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="alley">
  <main>
    <section class="card">
      <h2 class="h-icon"><img src="img/villa.svg" alt=""><span id="clusterName">우리 골목 단지</span></h2>
      <p class="sub" id="gaugeHint"></p>
      <div class="big-num" id="gaugeText"></div>
      <div class="bar" style="height:14px"><div id="gauge" style="width:0%;background:var(--blue)"></div></div>
      <div id="buildings" style="margin-top:12px"></div>
    </section>

    <section class="card" id="guardian">
      <h2 class="h-icon"><img src="img/person.png" alt="">골목 지킴이</h2>
      <p class="sub">일주일씩 돌아가며 모음터 주변을 정리해요. 인증하면 <span id="rewardAmount"></span>P를 드려요</p>
      <div class="panel" style="background:var(--blue-soft)">
        <h3 style="color:var(--blue-deep)" id="thisWeek"></h3>
        <p id="thisWeekHouse"></p>
      </div>
      <div id="roster"></div>

      <h3 style="margin:18px 0 4px">정리 인증하기</h3>
      <p class="muted">당번 주에 정리한 모음터 사진을 올려 주세요</p>
      <label for="proof">인증 사진</label>
      <input type="file" id="proof" accept="image/*" capture="environment">
      <img id="proofPreview" class="preview" alt="인증 사진 미리보기" hidden>
      <div class="btn-row"><button id="proofBtn" disabled>인증하고 포인트 받기</button></div>
      <p class="muted" id="proofMsg"></p>
    </section>

    <section class="card" id="retention">
      <h2 class="h-icon"><img src="img/flower.png" alt="">우리 골목 참여 현황</h2>
      <p class="sub">골목 카메라가 감지한 집 앞 배출 건수예요</p>
      <canvas id="doorstepChart" height="170"></canvas>
      <div id="trendBox"></div>

      <h3 class="h-icon" style="margin:18px 0 4px"><img src="img/laurel.png" alt="" style="width:24px;height:24px">우리 집 연속 참여</h3>
      <div class="chips" id="streak" style="margin:8px 0"></div>
      <div id="streakBox"></div>
    </section>

    <section class="card">
      <h2>우리 빌라 참여하기</h2>
      <p class="sub">같은 골목 빌라가 모여 60세대가 되면 지원 사업을 신청할 수 있어요</p>
      <label for="building">빌라 이름</label>
      <input id="building" placeholder="예: 행복빌라">
      <label for="households">세대수</label>
      <input id="households" type="number" min="1" placeholder="예: 8">
      <p class="muted" id="joinError" style="color:var(--full)" hidden>빌라 이름과 세대수를 모두 입력해 주세요</p>
      <button id="joinBtn">참여하기</button>
    </section>

    <section class="card">
      <h2>기능 설정</h2>
      <p class="sub">골목 단지에서 쓸 기능을 고를 수 있어요</p>
      <div id="settings"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/features.js"></script>
  <script src="js/layout.js"></script>
  <script>
    function renderCluster(c) {
      const pct = Math.min(100, Math.round(c.current / c.target * 100));
      document.getElementById("clusterName").textContent = c.name;
      document.getElementById("gaugeText").textContent = `${c.current} / ${c.target}세대`;
      document.getElementById("gauge").style.width = pct + "%";
      document.getElementById("gaugeHint").textContent = c.current >= c.target
        ? "60세대를 모았어요. 지자체 RFID 지원 사업을 신청할 수 있어요"
        : `${c.target - c.current}세대만 더 모이면 지원 사업을 신청할 수 있어요`;
      document.getElementById("buildings").innerHTML = c.buildings.map(b =>
        `<div class="row"><span>${b.name}</span><span class="muted">${b.households}세대</span></div>`).join("");
    }

    function renderGuardian() {
      const g = getGuardianRoster();
      const now = g.roster[g.currentIndex];
      document.getElementById("rewardAmount").textContent = GUARDIAN_REWARD;
      document.getElementById("thisWeek").textContent = `이번 주 지킴이 · ${now.week}`;
      document.getElementById("thisWeekHouse").textContent = now.house;
      document.getElementById("roster").innerHTML = g.roster.slice(1, 6).map((r, i) => `
        <div class="row">
          <span>${r.week}</span>
          <span>${r.house} ${r.isMe ? '<span class="badge info">내 차례</span>' : ""}</span>
        </div>`).join("");

      const proof = document.getElementById("proof");
      const btn = document.getElementById("proofBtn");
      proof.onchange = () => {
        if (!proof.files[0]) return;
        const img = document.getElementById("proofPreview");
        img.src = URL.createObjectURL(proof.files[0]);
        img.hidden = false;
        btn.disabled = false;
      };
      btn.onclick = () => {
        const total = addPoints(GUARDIAN_REWARD);
        btn.disabled = true;
        btn.textContent = "인증 완료";
        document.getElementById("proofMsg").textContent = `${GUARDIAN_REWARD}P를 받았어요. 지금 포인트는 ${total.toLocaleString()}P예요`;
        showToast("지킴이 인증 완료", `모음터 정리 고마워요! ${GUARDIAN_REWARD}P가 적립됐어요.`);
      };
    }

    function renderRetention() {
      new Chart(document.getElementById("doorstepChart"), {
        type: "bar",
        data: {
          labels: DOORSTEP_WEEKLY.map(w => w.week),
          datasets: [{ data: DOORSTEP_WEEKLY.map(w => w.count), backgroundColor: DOORSTEP_WEEKLY.map((w, i) => i >= DOORSTEP_WEEKLY.length - 2 ? "#e9a23b" : "#9cc1f5"), borderRadius: 6 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });

      const t = checkDoorstepTrend();
      const box = document.getElementById("trendBox");
      if (t.rising) {
        box.innerHTML = `
          <div class="panel caution">
            <h3>집 앞 배출이 다시 늘고 있어요</h3>
            <p>이번 주 ${t.latest}건으로 2주 연속 늘었어요. 골목 주민에게 리마인드를 보낼 수 있어요.</p>
            <div class="btn-row"><button class="small" id="remindBtn">골목에 리마인드 보내기</button></div>
          </div>`;
        document.getElementById("remindBtn").onclick = e => {
          e.target.parentElement.innerHTML = '<span class="badge info">오래3길 주민에게 리마인드를 보냈어요</span>';
          showToast("우리 골목 리마인드", "요즘 집 앞 배출이 늘었어요. 모음터를 이용해 주세요!");
        };
      } else {
        box.innerHTML = '<div class="panel good"><h3>모음터를 잘 이용하고 있어요</h3><p>집 앞 배출이 늘지 않았어요.</p></div>';
      }

      document.getElementById("streak").innerHTML = MY_PARTICIPATION.map(m =>
        `<span class="chip ${m.ok ? "on" : ""}" style="cursor:default">${m.month} ${m.ok ? "참여" : "진행 중"}</span>`).join("");
      const done = MY_PARTICIPATION.filter(m => m.ok).length;
      document.getElementById("streakBox").innerHTML = done >= 3
        ? `<div class="panel good"><h3>3개월 연속 참여 달성</h3><p>보너스 ${STREAK_REWARD.toLocaleString()}P를 받았어요.</p></div>`
        : `<div class="panel" style="background:var(--blue-soft)"><h3 style="color:var(--blue-deep)">이번 달까지 참여하면 3개월 연속이에요</h3><p>달성하면 보너스 ${STREAK_REWARD.toLocaleString()}P를 드려요.</p></div>`;
    }

    function renderSettings() {
      const f = getFeatures();
      document.getElementById("settings").innerHTML = FEATURE_LIST.map(item => `
        <div class="row">
          <div><div style="font-weight:600">${item.name}</div><div class="muted">${item.desc}</div></div>
          <label class="switch" aria-label="${item.name}">
            <input type="checkbox" data-key="${item.key}" ${f[item.key] ? "checked" : ""}><span></span>
          </label>
        </div>`).join("");
      document.querySelectorAll("#settings input").forEach(sw => sw.onchange = () => {
        setFeature(sw.dataset.key, sw.checked);
        location.reload();
      });
    }

    document.getElementById("joinBtn").onclick = async () => {
      const building = document.getElementById("building").value.trim();
      const households = document.getElementById("households").value;
      const err = document.getElementById("joinError");
      if (!building || !households) { err.hidden = false; return; }
      err.hidden = true;
      renderCluster(await joinCluster(1, { building, households }));
      document.getElementById("building").value = "";
      document.getElementById("households").value = "";
      showToast("골목 단지 참여", `${building}이(가) 골목 단지에 참여했어요.`);
    };
    ["building", "households"].forEach(id =>
      document.getElementById(id).addEventListener("input", () => document.getElementById("joinError").hidden = true));

    async function load() {
      const f = getFeatures();
      renderCluster(await getCluster(1));
      document.getElementById("guardian").hidden = !f.guardian;
      document.getElementById("retention").hidden = !f.retention;
      if (f.guardian) renderGuardian();
      if (f.retention) renderRetention();
      renderSettings();
    }
    load();
  </script>
</body>
</html>
